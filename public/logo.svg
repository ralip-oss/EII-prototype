<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e4faa"/>
      <stop offset="100%" stop-color="#1c3373"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect x="2" y="2" width="44" height="44" rx="12" fill="url(#bgGrad)"/>
  <rect x="2.5" y="2.5" width="43" height="43" rx="11.5" stroke="rgba(255,255,255,0.18)" stroke-width="1"/>

  <!-- Geometric weekly cadence pillars (Nordic-Japanese calm rhythm) -->
  <!-- Mon / Tue bar -->
  <rect x="11" y="21" width="5.5" height="15" rx="2.75" fill="url(#barGrad)" opacity="0.85"/>
  
  <!-- Wed / Thu peak focus bar -->
  <rect x="19" y="13" width="5.5" height="23" rx="2.75" fill="url(#barGrad)"/>
  
  <!-- Mindfulness cadence spark above peak -->
  <circle cx="21.75" cy="8.5" r="2.25" fill="#8df1de"/>

  <!-- Fri / Weekend unwind bar -->
  <rect x="27" y="17" width="5.5" height="19" rx="2.75" fill="url(#barGrad)" opacity="0.9"/>
  
  <!-- Tactile habit stick dot -->
  <rect x="35" y="25" width="5.5" height="11" rx="2.75" fill="#8df1de" opacity="0.95"/>
</svg>
